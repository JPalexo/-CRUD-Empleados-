spring:
  application:
    name: crud-empleados
  profiles:
    active: ${CRUD_PROFILE:local}
  datasource:
    url: jdbc:postgresql://${CRUD_DB_HOST}:${CRUD_DB_PORT}/${CRUD_DB_NAME}
    username: ${CRUD_DB_USER}
    password: ${CRUD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    basic:
      username: ${CRUD_BASIC_USER}
      password: ${CRUD_BASIC_PASSWORD}
