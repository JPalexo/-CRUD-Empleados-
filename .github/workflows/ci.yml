name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B test

  frontend-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  docker-validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose file
        run: docker compose config

      - name: Build Docker images
        run: docker compose build

  cypress-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs:
      - docker-validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start backend stack (Postgres + Backend)
        env:
          CRUD_DB_PASSWORD: empleados123
          CRUD_BASIC_USER: admin
          CRUD_BASIC_PASSWORD: admin123
        run: docker compose up -d --build postgres backend

      - name: Wait for backend readiness
        run: |
          for i in {1..45}; do
            if curl -fsS http://localhost:8081/actuator/health >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 4
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Run Cypress smoke and login tests
        run: npx --yes cypress run --config baseUrl=http://localhost:8081 --spec cypress/e2e/smoke.cy.js,cypress/e2e/login.cy.js

      - name: Print docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 backend postgres

      - name: Shutdown stack
        if: always()
        run: docker compose down -v
