name: 03-Cypress

on:
  workflow_run:
    workflows: ["02-SonarCloud"]
    types: [completed]

permissions:
  contents: read

jobs:
  cypress-placeholder:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository at triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cypress placeholder
        run: |
          echo "Cypress project not configured yet"
          echo "Simulating Cypress installation on Node 20"
          echo "Would run: npx cypress run"
