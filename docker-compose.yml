name: crud-empleados-003-departamentos

services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: crud-empleados-003-postgres:latest
    container_name: crud-empleados-003-postgres
    environment:
      POSTGRES_DB: ${CRUD_DB_NAME:-empleados}
      POSTGRES_USER: ${CRUD_DB_USER:-empleados_app}
      POSTGRES_PASSWORD: ${CRUD_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRUD_DB_USER:-empleados_app} -d ${CRUD_DB_NAME:-empleados}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${CRUD_DB_HOST_PORT:-5433}:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: crud-empleados-003-backend:latest
    container_name: crud-empleados-003-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CRUD_PROFILE: docker
      CRUD_DB_HOST: postgres
      CRUD_DB_PORT: 5432
      CRUD_DB_NAME: ${CRUD_DB_NAME:-empleados}
      CRUD_DB_USER: ${CRUD_DB_USER:-empleados_app}
      CRUD_DB_PASSWORD: ${CRUD_DB_PASSWORD}
      CRUD_BASIC_USER: ${CRUD_BASIC_USER}
      CRUD_BASIC_PASSWORD: ${CRUD_BASIC_PASSWORD}
    ports:
      - "${CRUD_APP_PORT:-8081}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: crud-empleados-003-frontend:latest
    container_name: crud-empleados-003-frontend
    depends_on:
      - backend
    ports:
      - "${CRUD_FRONTEND_PORT:-4200}:80"
